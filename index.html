<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muscle Concrete — Payment & Financing Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #121212; color: #E9E9E9;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 0 16px 64px;
  }
  .shell { max-width: 920px; margin: 0 auto; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 24px 0 18px; flex-wrap: wrap; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 64px; height: 64px; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #E9E9E9; }
  h1 .c { color: #F5B01C; }
  .sub { font-size: 12px; color: #9FA3A0; margin-top: 2px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
  input, button, textarea { font-family: inherit; }
  .in {
    padding: 9px 11px; border: 1px solid #3A3A3A; border-radius: 5px; font-size: 14px;
    background: #232323; color: #E9E9E9; outline: none; width: 100%;
  }
  .in::placeholder { color: #6E6E6E; }
  .in:focus { border-color: #F5B01C; }
  input[type="date"].in { color-scheme: dark; padding: 7px 9px; font-size: 13px; }
  textarea.in { resize: vertical; min-height: 54px; font-size: 13px; line-height: 1.4; }
  label { font-size: 12px; color: #9FA3A0; display: block; margin-bottom: 3px; }
  .btn-gold {
    background: #F5B01C; color: #141414; border: none; border-radius: 5px;
    padding: 7px 13px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-gold:hover { background: #FFC23D; }
  .btn-ghost {
    background: transparent; color: #C9C9C9; border: 1px solid #3A3A3A; border-radius: 5px;
    padding: 7px 13px; font-size: 13px; cursor: pointer;
  }
  .btn-ghost:hover { border-color: #5A5A5A; }
  .btn-ghost.gold { color: #F5B01C; border-color: #7A5A16; }
  .btn-ghost.gold:hover { border-color: #F5B01C; }
  .btn-x { background: transparent; color: #E06055; border: 1px solid #5A2C28; border-radius: 5px; padding: 6px 9px; font-size: 13px; cursor: pointer; }
  .btn-x:hover { border-color: #E06055; }
  button:disabled { opacity: .45; cursor: default; }
  .card { background: #1C1C1C; border: 1px solid #2E2E2E; border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
  .panel { background: #1C1C1C; border: 1px solid #2E2E2E; border-radius: 8px; padding: 16px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #9FA3A0; }
  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .sumcard { flex: 1 1 180px; background: #1C1C1C; border: 1px solid #2E2E2E; border-radius: 8px; padding: 14px 16px; }
  .sumcard .big { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tab { background: transparent; color: #C9C9C9; border: 1px solid #3A3A3A; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .tab.on { background: #F5B01C; color: #141414; border-color: #F5B01C; font-weight: 700; }
  .tab.sm { padding: 5px 12px; font-size: 12px; }
  .periodbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .pnav { background: transparent; color: #C9C9C9; border: 1px solid #3A3A3A; border-radius: 5px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .pnav:hover { border-color: #F5B01C; color: #F5B01C; }
  .plabel { font-size: 13px; font-weight: 700; color: #F5B01C; min-width: 130px; text-align: center; }
  .cardhead { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; flex-wrap: wrap; }
  .cardhead:hover { background: #202020; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid #2A2A2A; flex-wrap: wrap; }
  .badge { margin-left: 8px; font-size: 11px; font-weight: 600; color: #9FA3A0; background: #2A2A2A; border-radius: 4px; padding: 2px 6px; }
  .badge.extra { color: #F5B01C; background: #3A2F12; }
  .badge.deduct { color: #9FD0AE; background: #1D3326; }
  .badge.full { color: #141414; background: #F5B01C; font-weight: 800; letter-spacing: .05em; }
  .badge.flag { color: #FFB0A8; background: #4A211D; font-weight: 700; }
  .badge.fin { color: #A8C7F0; background: #1D2A3F; font-weight: 700; }
  .badge.wait { color: #F5B01C; background: #3A2F12; font-weight: 700; }
  .badge.late { color: #FFB0A8; background: #4A211D; font-weight: 700; }
  .paylink { color: #E06055; cursor: pointer; text-decoration: underline; font-size: 12px; }
  .addbar { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #2A2A2A; background: #181818; flex-wrap: wrap; align-items: center; }
  .del-job { background: transparent; color: #E06055; border: none; font-size: 12px; cursor: pointer; margin-left: auto; text-decoration: underline; }
  .empty { background: #1C1C1C; border: 1px solid #2E2E2E; border-radius: 8px; padding: 40px 20px; text-align: center; color: #9FA3A0; font-size: 14px; }
  .err { background: #33201E; border: 1px solid #5A2C28; color: #E06055; border-radius: 5px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .gold { color: #F5B01C; }
  .green { color: #9FD0AE; }
  .secthead { padding: 8px 14px 4px; border-top: 1px solid #2A2A2A; }
  .notesbox { padding: 6px 14px 12px; }
  .hint { font-size: 11px; color: #6E6E6E; margin-top: 3px; }
  .finrow { display: flex; gap: 10px; padding: 9px 14px; border-top: 1px solid #242424; flex-wrap: wrap; align-items: flex-end; }
  .findates { display: flex; gap: 10px; flex-wrap: wrap; }
  .findates > div { flex: 0 1 150px; }
  .checkimg { max-height: 64px; border-radius: 4px; border: 1px solid #3A3A3A; cursor: pointer; display: block; }
  .checkimg.big { max-height: none; max-width: 100%; }
</style>
</head>

/* ---- auth session ---- */
let session = null;       // { access_token, refresh_token, email }
let lastStamp = null;     // updated_at of the jobs row we last loaded
let syncMsg = "";

function loadSession() {
  try {
    const raw = localStorage.getItem("mc:session");
    if (raw) session = JSON.parse(raw);
  } catch (e) {}
}
function saveSession(s) {
  session = s;
  try { s ? localStorage.setItem("mc:session", JSON.stringify(s)) : localStorage.removeItem("mc:session"); } catch (e) {}
}

async function sbAuth(body, grant) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=" + grant, {
    method: "POST",
    headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error_description || "Login failed");
  return res.json();
}

async function sbFetch(path, opts, retry) {
  if (!session) throw new Error("Not signed in");
  const o = opts || {};
  o.headers = Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + session.access_token,
    "Content-Type": "application/json"
  }, o.headers || {});
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, o);
  if (res.status === 401 && !retry && session.refresh_token) {
    try {
      const d = await sbAuth({ refresh_token: session.refresh_token }, "refresh_token");
      saveSession({ access_token: d.access_token, refresh_token: d.refresh_token, email: session.email });
      return sbFetch(path, opts, true);
    } catch (e) { saveSession(null); render(); throw e; }
  }
  if (!res.ok) throw new Error("Database error " + res.status);
  return res;
}

/* ---- storage adapter: Supabase when configured, else Claude shared storage,
       else this browser, else memory ---- */
let memStore = {};
const store = {
  async load() {
    if (SB_READY && session) {
      const res = await sbFetch("kv?key=eq." + encodeURIComponent(KEY) + "&select=value,updated_at");
      const rows = await res.json();
      if (rows.length) { lastStamp = rows[0].updated_at; return JSON.parse(rows[0].value); }
      lastStamp = null;
      return [];
    }
    try {
      if (window.storage) {
        const r = await window.storage.get(KEY, true);
        return r && r.value ? JSON.parse(r.value) : [];
      }
    } catch (e) { return []; }
    try {
      if (window.localStorage) {
        const v = localStorage.getItem(KEY);
        return v ? JSON.parse(v) : [];
      }
    } catch (e) {}
    return memStore[KEY] || [];
  },
  async save(jobs) {
    const v = JSON.stringify(jobs);
    if (SB_READY && session) {
      try {
        const res = await sbFetch("kv?on_conflict=key", {
          method: "POST",
          headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
          body: JSON.stringify([{ key: KEY, value: v, updated_at: new Date().toISOString() }])
        });
        const rows = await res.json();
        if (rows.length) lastStamp = rows[0].updated_at;
        syncMsg = "Saved " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
        return true;
      } catch (e) { return false; }
    }
    try {
      if (window.storage) { const r = await window.storage.set(KEY, v, true); return !!r; }
    } catch (e) { return false; }
    try {
      if (window.localStorage) { localStorage.setItem(KEY, v); return true; }
    } catch (e) {}
    memStore[KEY] = jobs; return true;
  },
  async getBlob(key) {
    if (SB_READY && session) {
      try {
        const res = await sbFetch("kv?key=eq." + encodeURIComponent(key) + "&select=value");
        const rows = await res.json();
        return rows.length ? rows[0].value : null;
      } catch (e) { return null; }
    }
    try {
      if (window.storage) { const r = await window.storage.get(key, true); return r ? r.value : null; }
    } catch (e) { return null; }
    try { if (window.localStorage) return localStorage.getItem(key); } catch (e) {}
    return memStore[key] || null;
  },
  async setBlob(key, val) {
    if (SB_READY && session) {
      try {
        await sbFetch("kv?on_conflict=key", {
          method: "POST",
          headers: { "Prefer": "resolution=merge-duplicates" },
          body: JSON.stringify([{ key: key, value: val, updated_at: new Date().toISOString() }])
        });
        return true;
      } catch (e) { return false; }
    }
    try {
      if (window.storage) { const r = await window.storage.set(key, val, true); return !!r; }
    } catch (e) { return false; }
    try { if (window.localStorage) { localStorage.setItem(key, val); return true; } } catch (e) {}
    memStore[key] = val; return true;
  },
  async delBlob(key) {
    if (SB_READY && session) {
      try { await sbFetch("kv?key=eq." + encodeURIComponent(key), { method: "DELETE" }); } catch (e) {}
      return;
    }
    try { if (window.storage) { await window.storage.delete(key, true); return; } } catch (e) {}
    try { if (window.localStorage) localStorage.removeItem(key); } catch (e) {}
    delete memStore[key];
  },
  /* has anyone else saved since we loaded? */
  async remoteStamp() {
    if (!(SB_READY && session)) return null;
    try {
      const res = await sbFetch("kv?key=eq." + encodeURIComponent(KEY) + "&select=updated_at");
      const rows = await res.json();
      return rows.length ? rows[0].updated_at : null;
    } catch (e) { return null; }
  }
};

/* ---- helpers ---- */
const fmt = n => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n || 0);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => iso(new Date());
const pretty = s => {
  if (!s) return "";
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
};
const daysSince = s => {
  if (!s) return 0;
  const [y, m, d] = s.split("-").map(Number);
  return Math.floor((new Date() - new Date(y, m - 1, d)) / 86400000);
};
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const r2 = n => Math.round(n * 100) / 100;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* job math */
const chargesOf = j => r2(j.total + j.extras.reduce((s, x) => s + x.amount, 0) - (j.dealerDeposit || 0));
const paidOf = j => r2(j.payments.reduce((s, p) => s + p.amount, 0));
const balanceOf = j => r2(chargesOf(j) - paidOf(j));
const jobDone = j => balanceOf(j) <= 0.005;
const emptyFin = () => ({
  first: { invoiced: "", received: "", deposited: "", imgId: "", paymentId: "" },
  final: { invoiced: "", received: "", deposited: "", imgId: "", paymentId: "" }
});
/* a check that's been received but not yet deposited (job not on site yet) */
const heldOn = j => {
  if (!j.financed) return 0;
  let s = 0;
  const half = r2((j.total - (j.dealerDeposit || 0)) / 2);
  for (const leg of ["first", "final"]) {
    const f = j.fin[leg];
    if (f.received && !f.deposited) s += half;
  }
  return r2(s);
};

/* ---- migrate data from earlier versions ---- */
function migJob(j) {
  if (Array.isArray(j.payments)) {
    const base = { flagNote: "", dealerDeposit: 0, financed: false, pourPending: false, scheduled: true, invoiceNo: "", schedDate: "", fin: emptyFin(), ...j, fin: j.fin ? j.fin : emptyFin() };
    for (const leg of ["first", "final"]) if (base.fin[leg] && base.fin[leg].deposited === undefined) base.fin[leg].deposited = "";
    if (!base.type) base.type = base.financed ? "financed" : (base.dealerDeposit > 0 ? "dealer" : "inhouse");
    base.financed = base.type === "financed";
    return base;
  }
  const payments = [];
  const pull = (st, label) => {
    if (!st) return;
    if (Array.isArray(st.payments)) {
      for (const p of st.payments) payments.push({ id: p.id || uid(), amount: p.amount, date: p.date, note: label });
    } else if (st.status === "paid") {
      payments.push({ id: uid(), amount: st.amount, date: st.paidDate || today(), note: label });
    }
  };
  pull(j.arrival, "Arrival");
  pull(j.completion, "Completion");
  const extras = (j.extras || []).map(x => {
    pull(x, x.desc);
    return { id: x.id || uid(), desc: x.desc, amount: x.amount };
  });
  if (j.deposit > 0) payments.unshift({ id: uid(), amount: j.deposit, date: j.createdAt || today(), note: "Deposit" });
  return { id: j.id, customer: j.customer, note: j.note || "", flagNote: "", dealerDeposit: 0,
    type: "inhouse", financed: false, pourPending: false, scheduled: true, invoiceNo: "", schedDate: "", fin: emptyFin(), total: j.total, extras, payments, createdAt: j.createdAt || today() };
}

/* ---- period ---- */
let period = "all";
let offset = 0;

function periodRange() {
  const now = new Date();
  let start, end, label;
  if (period === "week") {
    const s = new Date(now);
    s.setDate(s.getDate() - s.getDay() + offset * 7);
    const e = new Date(s); e.setDate(e.getDate() + 7);
    const eShow = new Date(s); eShow.setDate(eShow.getDate() + 6);
    start = s; end = e;
    const f = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    label = f(s) + " – " + f(eShow) + ", " + eShow.getFullYear();
  } else if (period === "month") {
    start = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    end = new Date(now.getFullYear(), now.getMonth() + offset + 1, 1);
    label = start.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  } else if (period === "quarter") {
    const q = Math.floor(now.getMonth() / 3) + offset;
    start = new Date(now.getFullYear(), q * 3, 1);
    end = new Date(now.getFullYear(), q * 3 + 3, 1);
    label = "Q" + (Math.floor(start.getMonth() / 3) + 1) + " " + start.getFullYear();
  } else if (period === "year") {
    start = new Date(now.getFullYear() + offset, 0, 1);
    end = new Date(now.getFullYear() + offset + 1, 0, 1);
    label = String(start.getFullYear());
  } else {
    return null;
  }
  return { start: iso(start), end: iso(end), label };
}
const inRange = (dateStr, rng) => dateStr >= rng.start && dateStr < rng.end;
function weekRange(off) {
  const s = new Date();
  s.setDate(s.getDate() - s.getDay() + (off || 0) * 7);
  const e = new Date(s); e.setDate(e.getDate() + 7);
  const eShow = new Date(s); eShow.setDate(eShow.getDate() + 6);
  const f = d => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return { start: iso(s), end: iso(e), label: f(s) + " – " + f(eShow) };
}

/* ---- check image handling ---- */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 900;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = () => reject(new Error("bad image"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("read failed"));
    reader.readAsDataURL(file);
  });
}

async function loadImagesFor(list) {
  for (const j of list) {
    if (!j.financed || expanded[j.id] === false) continue;
    for (const leg of ["first", "final"]) {
      const id = j.fin[leg].imgId;
      if (id && !imgCache[id]) {
        const data = await store.getBlob("checkimg:" + id);
        if (data) {
          imgCache[id] = data;
          const el = document.getElementById("img-" + id);
          if (el) el.src = data;
        }
      }
    }
  }
}

      body += `<div class="secthead eyebrow">Financing — invoices <span style="color:#6E6E6E;text-transform:none;letter-spacing:0">(50/50 split${dd > 0 ? " of balance after dealer deposit" : ""} · each invoice = <span class="mono">${fmt(invBase)}</span>)</span></div>`;
      body += `<div class="finrow" style="align-items:center">
        <div style="flex:1 1 140px;min-width:120px">
          <div style="font-size:14px;font-weight:600">Invoice #</div>
          <div class="hint">Assigned by the lender</div>
        </div>
        <div class="mono" style="font-size:16px;font-weight:700;color:${job.invoiceNo ? "#A8C7F0" : "#6E6E6E"}">${job.invoiceNo ? esc(job.invoiceNo) : "— not set —"}</div>
        <button class="btn-ghost" onclick="A.setInvoiceNo('${job.id}')">${job.invoiceNo ? "Edit" : "Add invoice #"}</button>
      </div>`;
      body += finLegHTML(job, "first", "1st invoice — 50%", "Mark received the day the check is deposited on site.");
      body += finLegHTML(job, "final", "Completion invoice", "Typically ~2 weeks after the customer approves and releases funds.");
    }

    body += `<div class="secthead eyebrow">Payments received${paid > 0 ? ` — <span class="mono" style="color:#E9E9E9">${fmt(paid)}</span>` : ""}</div>`;
    if (job.payments.length === 0) {
      body += `<div style="padding:4px 14px 8px;font-size:13px;color:#6E6E6E">Nothing recorded yet.</div>`;
    } else {
      for (const p of job.payments) {
        const inP = rng && inRange(p.date, rng);
        if (editingPay[p.id]) {
          body += `<div class="row" style="border-top:1px solid #242424;background:#221D0F;align-items:flex-end">
            <div style="flex:0 1 110px;min-width:100px"><label>Amount</label>
              <input id="edit-amt-${p.id}" class="in mono" type="number" min="0" step="0.01" value="${p.amount}"></div>
            <div style="flex:0 1 150px;min-width:130px"><label>Date received</label>
              <input id="edit-date-${p.id}" class="in" type="date" value="${esc(p.date)}"></div>
            <div style="flex:1 1 140px;min-width:120px"><label>Note</label>
              <input id="edit-note-${p.id}" class="in" value="${esc(p.note || "")}" placeholder="Optional"
                onkeydown="if(event.key==='Enter')A.savePayEdit('${job.id}','${p.id}')"></div>
            <button class="btn-gold" onclick="A.savePayEdit('${job.id}','${p.id}')">Save</button>
            <button class="btn-ghost" onclick="A.editPay('${p.id}')">Cancel</button>
          </div>`;
        } else {
          body += `<div class="row" style="border-top:1px solid #242424;${inP ? "background:#221D0F" : ""}">
            <div style="flex:1 1 150px;min-width:130px;font-size:13px;color:#C9C9C9">
              <span class="mono" style="font-size:14px;font-weight:600;color:${p.amount < 0 ? "#E06055" : "#E9E9E9"}">${p.amount < 0 ? "−" + fmt(-p.amount) : fmt(p.amount)}</span>
              ${p.amount < 0 ? '<span class="badge flag">Chargeback</span>' : ""}
              <span style="color:#9FA3A0"> — ${pretty(p.date)}${p.note ? " · " + esc(p.note) : ""}</span>
            </div>
            <a class="paylink" style="color:#F5B01C" onclick="A.editPay('${p.id}')">edit</a>
            <a class="paylink" onclick="A.removePay('${job.id}','${p.id}')">remove</a>
          </div>`;
        }
      }
    }
    body += `<div class="addbar">
      <input class="in mono" style="flex:1 1 100px;min-width:100px" type="number" min="0" step="0.01" placeholder="Amount paid" value="${esc(pd.amount)}"
        oninput="A.payDraft('${job.id}','amount',this.value)"
        onkeydown="if(event.key==='Enter')A.recordPayment('${job.id}',1)">
      <input class="in" style="flex:0 1 150px;min-width:130px" type="date" value="${esc(pd.date || today())}" title="Date received — change it if the money came in earlier"
        onchange="A.payDraft('${job.id}','date',this.value)">
      <input class="in" style="flex:2 1 140px;min-width:120px" placeholder="Note — deposit, arrival, check #… (optional)" value="${esc(pd.note)}"
        oninput="A.payDraft('${job.id}','note',this.value)"
        onkeydown="if(event.key==='Enter')A.recordPayment('${job.id}',1)">
      <button id="recbtn-${job.id}" class="btn-gold" onclick="A.recordPayment('${job.id}',1)" ${num(pd.amount) <= 0 ? "disabled" : ""}>Record payment</button>
      <button id="cbbtn-${job.id}" class="btn-ghost" style="color:#E06055;border-color:#5A2C28" onclick="A.recordPayment('${job.id}',-1)" ${num(pd.amount) <= 0 ? "disabled" : ""} title="Money pulled back out of our account — dispute, bounced check, refund">− Chargeback</button>
      ${!done ? `<button class="btn-ghost gold" onclick="A.payRemaining('${job.id}')" title="Record the remaining ${fmt(bal)}">Paid in full</button>` : ""}
    </div>`;

    body += `<div class="notesbox" style="border-top:1px solid #2A2A2A">
      <label style="margin-top:6px">Notes — disputes, holds, reminders</label>
      <textarea class="in" placeholder="e.g. Disputing the dirt charge, holding final payment until crack is fixed…"
        oninput="A.setFlagNote('${job.id}', this.value)">${esc(job.flagNote || "")}</textarea>
      <div style="display:flex;margin-top:6px">
        <button class="del-job" onclick="A.removeJob('${job.id}')">Delete customer</button>
      </div>
    </div>`;
  }

  const ddLine = dd > 0 ? ` · Dealer deposit −${fmt(dd)}` : "";
  // header financing status chip
  let finChip = "";
  if (job.financed) {
    const fw = job.fin.final.invoiced && !job.fin.final.received;
    const fw1 = job.fin.first.invoiced && !job.fin.first.received;
    if (fw) { const d = daysSince(job.fin.final.invoiced); finChip = `<span class="badge ${d > 21 ? "late" : "wait"}">Final inv · ${d}d</span>`; }
    else if (fw1) { const d = daysSince(job.fin.first.invoiced); finChip = `<span class="badge ${d > 21 ? "late" : "wait"}">1st inv · ${d}d</span>`; }
    else finChip = `<span class="badge fin">Financed</span>`;
  }
  return `<div class="card" style="${flagged ? "border-color:#5A2C28" : ""}">
    <div class="cardhead" onclick="A.toggle('${job.id}')">
      <div style="flex:1 1 160px;min-width:140px">
        <div style="font-weight:700;font-size:16px;color:${done ? "#7A7A7A" : "#E9E9E9"}">${esc(job.customer)}
          ${job.invoiceNo ? `<span class="badge mono" style="color:#A8C7F0;background:#1D2A3F">INV #${esc(job.invoiceNo)}</span>` : ""}
          ${done ? '<span class="badge full">PAID IN FULL</span>' : ""}${finChip}
          ${job.scheduled === false && !done ? '<span class="badge fin">📋 NOT SCHEDULED</span>' : ""}
          ${job.schedDate && job.scheduled !== false && !done ? `<span class="badge">📅 ${pretty(job.schedDate)}</span>` : ""}
          ${heldOn(job) > 0 ? `<span class="badge fin">✋ ${fmt(heldOn(job))} held</span>` : ""}
          ${job.pourPending && !done ? '<span class="badge wait">⏳ POUR PENDING</span>' : ""}
          <span id="flag-${job.id}" class="badge flag" style="${flagged ? "" : "display:none"}" title="${esc(job.flagNote)}">⚑ NOTE</span></div>
        <div style="font-size:12px;color:#9FA3A0">${job.type === "dealer" ? "Dealer · " : job.type === "inhouse" ? "In-house · " : ""}Contract ${fmt(job.total)}${ddLine} · Paid ${fmt(paid)}${job.note ? " · " + esc(job.note) : ""}</div>
      </div>
      ${!done ? (job.pourPending ? `<div style="text-align:right">
        <div class="eyebrow" style="font-size:11px">Remaining — not owed yet</div>
        <div class="mono" style="font-size:18px;font-weight:700;color:#9FA3A0">${fmt(bal)}</div></div>`
      : `<div style="text-align:right">
        <div class="eyebrow" style="font-size:11px">Still owed</div>
        <div class="mono gold" style="font-size:18px;font-weight:700">${fmt(bal)}</div></div>`)
      : (overpaid ? `<div style="text-align:right">
        <div class="eyebrow" style="font-size:11px">Overpaid</div>
        <div class="mono" style="font-size:16px;font-weight:700;color:#C9C9C9">${fmt(r2(paid - charges))}</div></div>` : "")}
      <div style="color:#6E6E6E;font-size:13px">${open ? "▾" : "▸"}</div>
    </div>${body}</div>`;
}

function renderList() {
  const el = document.getElementById("list");
  if (!el) return;
  const rng = periodRange();
  let list = jobs;
  if (view === "week") {
    const w = weekRange(weekOff);
    list = list.filter(j => j.schedDate && inRange(j.schedDate, w) && j.scheduled !== false);
    list = [...list].sort((a, b) => (a.schedDate < b.schedDate ? -1 : 1));
  }
  if (view === "active") list = list.filter(j => !jobDone(j));
  if (view === "unscheduled") list = list.filter(j => j.scheduled === false && !jobDone(j));
  if (view === "done") list = list.filter(jobDone);
  if (view === "flagged") list = list.filter(j => (j.flagNote || "").trim());
  if (view === "financed") list = list.filter(j => j.financed);
  if (rng) list = list.filter(j => inRange(j.createdAt, rng) || j.payments.some(p => inRange(p.date, rng)));
  if (search.trim()) {
    const q = search.trim().toLowerCase();
    list = list.filter(j => j.customer.toLowerCase().includes(q) || (j.note || "").toLowerCase().includes(q) || (j.flagNote || "").toLowerCase().includes(q) || (j.invoiceNo || "").toLowerCase().includes(q));
  }
  el.innerHTML = list.length
    ? list.map(j => jobCardHTML(j, rng)).join("")
    : `<div class="empty">${jobs.length === 0 ? "No customers yet. Add one to start tracking."
        : view === "week" ? "Nothing on the schedule for this week. Set a job date on a customer's card to put them here."
        : rng ? "No activity in this period — no payments received and no jobs added." : "Nothing matches this view."}</div>`;
  loadImagesFor(list);
}

function renderLogin() {
  document.getElementById("app").innerHTML = `
    <div style="max-width:360px;margin:12vh auto 0;text-align:center">
      <img src="${LOGO}" alt="Muscle Concrete" style="width:96px;height:96px">
      <h1 style="margin:14px 0 0">Muscle <span class="c">Concrete</span></h1>
      <div class="sub" style="margin-bottom:22px">Payment &amp; Financing Tracker</div>
      <div class="panel" style="text-align:left">
        <div><label>Email</label><input id="login-email" class="in" type="email" autocomplete="username"
          onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()"></div>
        <div style="margin-top:10px"><label>Password</label><input id="login-pass" class="in" type="password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')A.login()"></div>
        <div id="login-err" class="err" style="display:none;margin:12px 0 0"></div>
        <button id="login-btn" class="btn-gold" style="margin-top:14px;width:100%;padding:11px;font-size:14px" onclick="A.login()">Sign in</button>
      </div>
    </div>`;
  const e = document.getElementById("login-email");
  if (e) e.focus();
}

/* Check every 20s for changes saved by anyone else, and pull them in */
let pollTimer = null;
function startPolling() {
  if (pollTimer || !(SB_READY)) return;
  pollTimer = setInterval(async () => {
    if (!session || showForm) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;   // don't yank the page while someone types
    const stamp = await store.remoteStamp();
    if (stamp && stamp !== lastStamp) {
      jobs = (await store.load()).map(migJob);
      syncMsg = "Updated with changes from the team";
      render();
    }
  }, 20000);
}

function render() {
  if (SB_READY && !session) { renderLogin(); return; }
  const rng = periodRange();
  let owed = 0, collAll = 0, collPeriod = 0, active = 0, flaggedCount = 0, finCount = 0, pipeline = 0, pourHold = 0, unscheduled = 0;
  let notSchedOwed = 0, heldTotal = 0, weekCount = 0;
  const wk = weekRange();
  for (const j of jobs) {
    const b = Math.max(0, balanceOf(j));
    heldTotal += heldOn(j);
    if (j.schedDate && !jobDone(j) && inRange(j.schedDate, wk)) weekCount++;
    if (j.pourPending) pourHold += b;
    else if (j.scheduled === false) notSchedOwed += b;
    else owed += b;
    collAll += paidOf(j);
    if (rng) for (const p of j.payments) if (inRange(p.date, rng)) collPeriod += p.amount;
    if (!jobDone(j)) active++;
    if (j.scheduled === false && !jobDone(j)) unscheduled++;
    if ((j.flagNote || "").trim()) flaggedCount++;
    if (j.financed) {
      finCount++;
      for (const leg of ["first", "final"]) {
        const f = j.fin[leg];
        if (f.invoiced && !f.received) pipeline += r2((j.total - (j.dealerDeposit || 0)) / 2);
      }
    }
  }
  owed = r2(owed); collAll = r2(collAll); collPeriod = r2(collPeriod); pipeline = r2(pipeline); pourHold = r2(pourHold);
  notSchedOwed = r2(notSchedOwed); heldTotal = r2(heldTotal);
  const doneCount = jobs.length - active;

  document.getElementById("app").innerHTML = `
    <div class="header">
      <div class="brand">
        <img src="${LOGO}" alt="Muscle Concrete logo">
        <div>
          <h1>Muscle <span class="c">Concrete</span></h1>
          <div class="sub">Payment & Financing Tracker</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${syncMsg ? `<span class="hint" style="margin:0">${esc(syncMsg)}</span>` : ""}
        <button id="refreshbtn" class="btn-ghost" onclick="A.refresh()" title="Pull the latest changes saved by anyone on the team">⟳ Refresh</button>
        ${SB_READY && session ? `<button class="btn-ghost" onclick="A.logout()" title="${esc(session.email)}">Sign out</button>` : ""}
        <button class="btn-gold" style="padding:10px 18px;font-size:14px;${showForm ? "background:transparent;color:#F5B01C;border:1px solid #F5B01C" : ""}"
          onclick="A.toggleForm()">${showForm ? "Cancel" : "+ New customer"}</button>
      </div>
    </div>
    ${saveError ? `<div class="err">Couldn't save your last change. Check your connection and try again.</div>` : ""}
    ${showForm ? `
    <div class="panel">
      <div class="grid">
        <div><label>Customer</label><input class="in" placeholder="Customer name" value="${esc(form.customer)}"
          oninput="A.formSet('customer',this.value)"></div>
        <div><label>Full contract amount</label><input class="in mono" type="number" min="0" step="0.01" placeholder="0.00" value="${esc(form.total)}"
          oninput="A.formSet('total',this.value)"></div>
        <div><label>Deposit paid to dealer (if any)</label><input class="in mono" type="number" min="0" step="0.01" placeholder="0.00" value="${esc(form.dealerDeposit)}"
          oninput="A.formSet('dealerDeposit',this.value)">
          <div class="hint">Comes off what they owe us — not money we collected.</div></div>
        <div><label>Note / job info</label><input class="in" placeholder="Optional" value="${esc(form.note)}"
          oninput="A.formSet('note',this.value)"
          onkeydown="if(event.key==='Enter')A.addJob()"></div>
      </div>
      <div style="margin-top:12px">
        <label>Customer type</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${[["inhouse", "In-house"], ["dealer", "Dealer"], ["financed", "Financed 50/50"]].map(([t, lbl]) =>
            `<button class="tab ${form.type === t ? "on" : ""}" onclick="A.formType('${t}')">${lbl}</button>`).join("")}
        </div>
      </div>
      ${form.type === "inhouse" ? `
      <div style="margin-top:12px;max-width:280px">
        <label>Deposit collected (paid to us)</label>
        <input class="in mono" type="number" min="0" step="0.01" placeholder="0.00" value="${esc(form.inhouseDeposit)}"
          oninput="A.formSet('inhouseDeposit',this.value)">
        <div class="hint">Goes straight into their payment log as "Deposit" — counts as money we collected.</div>
      </div>` : ""}
      ${form.type === "financed" ? `
      <div style="margin-top:12px;max-width:280px">
        <label>Invoice # (assigned by the lender)</label>
        <input class="in mono" placeholder="e.g. 48231" value="${esc(form.invoiceNo)}"
          oninput="A.formSet('invoiceNo',this.value)">
      </div>` : ""}
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:#E9E9E9;cursor:pointer">
        <input type="checkbox" ${form.notScheduled ? "checked" : ""} onchange="A.formSched(this.checked)" style="width:16px;height:16px;accent-color:#F5B01C">
        Not on the schedule yet${form.type === "financed" ? " — waiting on first check" : ""}
      </label>
      ${form.type === "financed" ? `
      <div class="hint" style="margin-top:10px">Invoicing splits the remaining balance 50/50 — you'll get invoice date tracking and check images on the customer's card.</div>` : ""}
      <button id="savejob" class="btn-gold" style="margin-top:12px;padding:10px 18px;font-size:14px" onclick="A.addJob()" ${!form.customer.trim() || num(form.total) <= 0 ? "disabled" : ""}>Save customer</button>
    </div>` : ""}

    <div class="periodbar">
      <span class="eyebrow" style="margin-right:2px">Period:</span>
      ${["all", "week", "month", "quarter", "year"].map(p =>
        `<button class="tab sm ${period === p ? "on" : ""}" onclick="A.setPeriod('${p}')">${p === "all" ? "All time" : p[0].toUpperCase() + p.slice(1)}</button>`
      ).join("")}
      ${rng ? `<button class="pnav" onclick="A.shiftPeriod(-1)">◀</button>
        <span class="plabel">${rng.label}</span>
        <button class="pnav" onclick="A.shiftPeriod(1)" ${offset >= 0 ? "disabled" : ""}>▶</button>
        ${offset < 0 ? `<button class="pnav" onclick="A.shiftPeriod(${-offset})">Today</button>` : ""}` : ""}
    </div>

    <div class="summary">
      <div class="sumcard" style="border-top:3px solid #F5B01C">
        <div class="eyebrow">Owed — scheduled work</div>
        <div class="big mono gold">${fmt(owed)}</div>
        <div style="font-size:12px;color:#9FA3A0;margin-top:2px">${active} active job${active === 1 ? "" : "s"}${pourHold > 0 ? ` · ⏳ ${fmt(pourHold)} pending pour` : ""}</div>
      </div>
      <div class="sumcard" style="border-top:3px solid #4A6A9A">
        <div class="eyebrow">✋ Checks in hand</div>
        <div class="big mono" style="color:#A8C7F0">${fmt(heldTotal)}</div>
        <div style="font-size:12px;color:#9FA3A0;margin-top:2px">received, not deposited yet</div>
      </div>
      <div class="sumcard" style="border-top:3px solid #6E6E6E">
        <div class="eyebrow">Not scheduled yet</div>
        <div class="big mono" style="color:#9FA3A0">${fmt(notSchedOwed)}</div>
        <div style="font-size:12px;color:#9FA3A0;margin-top:2px">${unscheduled} waiting to schedule</div>
      </div>
      <div class="sumcard" style="border-top:3px solid #4A4A4A">
        <div class="eyebrow">Collected${rng ? " — " + rng.label : ""}</div>
        <div class="big mono" style="color:#C9C9C9">${fmt(rng ? collPeriod : collAll)}</div>
        <div style="font-size:12px;color:#9FA3A0;margin-top:2px">${rng ? "All time: " + fmt(collAll) : doneCount + " fully paid"}</div>
      </div>
    </div>

    <div class="filters">
      <button class="tab ${view === "week" ? "on" : ""}" onclick="A.setView('week')">📅 This week (${weekCount})</button>
      <button class="tab ${view === "active" ? "on" : ""}" onclick="A.setView('active')">Active (${active})</button>
      <button class="tab ${view === "unscheduled" ? "on" : ""}" onclick="A.setView('unscheduled')">📋 Waiting to schedule (${unscheduled})</button>
      <button class="tab ${view === "financed" ? "on" : ""}" onclick="A.setView('financed')">Financed (${finCount})</button>
      <button class="tab ${view === "done" ? "on" : ""}" onclick="A.setView('done')">Fully paid (${doneCount})</button>
      <button class="tab ${view === "flagged" ? "on" : ""}" onclick="A.setView('flagged')">⚑ Flagged (${flaggedCount})</button>
      <button class="tab ${view === "all" ? "on" : ""}" onclick="A.setView('all')">All</button>
      <input class="in" style="width:auto;flex:1 1 160px;min-width:140px" placeholder="Search name, invoice #, notes…" value="${esc(search)}"
        oninput="A.setSearch(this.value)">
      <button class="tab sm" onclick="A.expandAll(true)" title="Open every card">Expand all</button>
      <button class="tab sm" onclick="A.expandAll(false)" title="Close every card">Collapse all</button>
    </div>
    ${view === "week" ? `<div class="periodbar" style="margin:-2px 0 12px">
      <button class="pnav" onclick="A.shiftWeek(-1)">◀ Prev week</button>
      <span class="plabel">${weekRange(weekOff).label}${weekOff === 0 ? " · this week" : ""}</span>
      <button class="pnav" onclick="A.shiftWeek(1)">Next week ▶</button>
      ${weekOff !== 0 ? `<button class="pnav" onclick="A.shiftWeek(${-weekOff})">Today</button>` : ""}
    </div>` : ""}
    <div id="list"></div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:24px;padding-top:14px;border-top:1px solid #2A2A2A;flex-wrap:wrap">
      <span class="hint" style="margin:0">Backup:</span>
      <button class="btn-ghost" onclick="A.exportData()">⬇ Export backup</button>
      <label class="btn-ghost" style="cursor:pointer">⬆ Import backup
        <input type="file" accept="application/json,.json" style="display:none" onchange="A.importData(this)"></label>
      <span class="hint" style="margin:0">Export now and then — it saves every customer, payment, and check image to a file.</span>
    </div>`;
  renderList();
}

(async () => {
  document.getElementById("app").innerHTML =
    `<div style="padding:60px 0;text-align:center;color:#9FA3A0">Loading your ledger…</div>`;
  loadSession();
  if (SB_READY && !session) { renderLogin(); return; }
  try { jobs = (await store.load()).map(migJob); } catch (e) { jobs = []; saveSession(null); }
  startPolling();
  render();
})();
</script>
</body>
</html>
